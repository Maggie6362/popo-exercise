<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>婆婆與阿凱的健康運動打卡</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="婆婆運動打卡">
  <link rel="apple-touch-icon" href="akai_app_icon_new.png">
  <style>
    :root {
      --bg: #FDFBF7;
      --card-bg: #FFFFFF;
      --text-main: #2D3748;
      --text-muted: #718096;
      --primary: #FF7A59;
      --primary-light: #FFF0EB;
      --border: #EDF2F7;
      --shadow: 0 4px 14px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro TC", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-main);
      display: flex;
      justify-content: center;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      padding: 16px 16px 40px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .top-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px 0;
    }
    .date-badge {
      font-size: 22px;
      font-weight: 800;
      color: #2D3748;
    }
    .hero-card {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 14px;
      border: 2px solid #FED7D7;
    }
    .akai-avatar {
      width: 100px;
      height: 100px;
      border-radius: 18px;
      object-fit: cover;
      background: #FFFFFF;
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .speech-bubble {
      flex: 1;
      background: #FFF5F5;
      border: 2px solid #FEB2B2;
      border-radius: 18px;
      padding: 12px 14px;
      position: relative;
    }
    .speech-bubble::before {
      content: "";
      position: absolute;
      left: -10px;
      top: 50%;
      transform: translateY(-50%);
      border-width: 6px 10px 6px 0;
      border-style: solid;
      border-color: transparent #FEB2B2 transparent transparent;
    }
    .speech-text {
      font-size: 19px;
      font-weight: 800;
      line-height: 1.4;
      color: #9B2C2C;
      margin: 0;
    }
    .replay-voice-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
      background: #FED7D7;
      border: none;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 14px;
      font-weight: 700;
      color: #9B2C2C;
      cursor: pointer;
    }
    .progress-box {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .progress-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .progress-title {
      font-size: 19px;
      font-weight: 800;
    }
    .stars {
      font-size: 24px;
      letter-spacing: 2px;
    }
    .bar-bg {
      width: 100%;
      height: 16px;
      background: #EDF2F7;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #FFB199 0%, #FF7A59 100%);
      border-radius: 10px;
      transition: width 0.4s ease;
    }
    .progress-status {
      font-size: 16px;
      font-weight: 700;
      color: #718096;
      text-align: right;
    }
    .exercise-section-title {
      font-size: 21px;
      font-weight: 800;
      color: #2D3748;
      margin: 4px 0 0 2px;
    }
    .exercise-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .ex-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      border: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.2s ease;
    }
    .ex-card.checked {
      background: #F0FFF4;
      border-color: #68D391;
    }
    .ex-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ex-name-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ex-icon { font-size: 28px; }
    .ex-name {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-main);
    }
    .ex-badge {
      font-size: 15px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      background: #EDF2F7;
      color: #4A5568;
    }
    .ex-card.checked .ex-badge {
      background: #C6F6D5;
      color: #22543D;
    }
    .ex-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }
    .ex-target {
      font-size: 18px;
      font-weight: 700;
      color: #4A5568;
    }
    .video-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #EBF8FF;
      color: #2B6CB0;
      font-size: 16px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 14px;
      text-decoration: none;
      border: 1px solid #BEE3F8;
    }
    .check-btn {
      width: 100%;
      padding: 16px 0;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
    }
    .check-btn:active { transform: scale(0.98); }
    .check-btn.btn-todo {
      background: #FF7A59;
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(255, 122, 89, 0.35);
    }
    .check-btn.btn-done {
      background: #38A169;
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(56, 161, 105, 0.3);
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 999;
    }
    .modal-overlay.show { display: flex; }
    .modal-card {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      animation: pop 0.25s ease-out;
    }
    @keyframes pop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-avatar {
      width: 130px;
      height: 130px;
      border-radius: 24px;
      object-fit: cover;
      margin-bottom: 14px;
    }
    .modal-title {
      font-size: 24px;
      font-weight: 900;
      color: #2D3748;
      margin-bottom: 8px;
    }
    .modal-body {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.5;
      color: #4A5568;
      margin-bottom: 20px;
    }
    .modal-close-btn {
      background: #FF7A59;
      color: white;
      font-size: 20px;
      font-weight: 800;
      border: none;
      border-radius: 16px;
      padding: 12px 30px;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="top-bar">
      <div class="date-badge" id="current-date">今天</div>
    </div>

    <div class="hero-card">
      <img id="hero-avatar" class="akai-avatar" src="akai_wave.png?v=200" alt="阿凱" onclick="playCurrentAudio()">
      <div class="speech-bubble">
        <p id="speech-bubble-text" class="speech-text">婆婆早安！今天想做什麼運動呢？我來陪你一起動一動喔！</p>
        <button class="replay-voice-btn" onclick="playCurrentAudio()">🔊 聽阿凱說話</button>
      </div>
    </div>

    <div class="progress-box">
      <div class="progress-title-row">
        <span class="progress-title">今日活力進度</span>
        <span id="star-display" class="stars">☆☆☆</span>
      </div>
      <div class="bar-bg">
        <div id="progress-bar-fill" class="bar-fill"></div>
      </div>
      <div id="progress-text" class="progress-status">尚未開始，今天選 2~3 項動一動！</div>
    </div>

    <div class="exercise-section-title">請選擇 2～3 項運動：</div>
    <div class="exercise-list" id="exercise-list-container"></div>
  </div>

  <div class="modal-overlay" id="reward-modal" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <img id="modal-img" class="modal-avatar" src="akai_thumbs.png" alt="阿凱稱讚">
      <div id="modal-title" class="modal-title">太棒了！</div>
      <div id="modal-body" class="modal-body">阿凱給婆婆比兩個大拇指！</div>
      <button class="modal-close-btn" onclick="closeModal()">繼續加油！</button>
    </div>
  </div>

  <audio id="audio-player" preload="auto"></audio>

  <script>
    const EXERCISES = [
      { id: 'park_walk', name: '綠園道散步', icon: '🌳', target: '建議 20～30 分鐘', score: 40, videoUrl: null },
      { id: 'swimming', name: '溫水游泳／漫步', icon: '🏊‍♀️', target: '建議 20～30 分鐘', score: 40, videoUrl: null },
      { id: 'march_in_place', name: '家中原地踏步', icon: '🚶‍♀️', target: '建議 10～15 分鐘', score: 30, videoUrl: 'https://www.youtube.com/results?search_query=長者+原地踏步+運動教學' },
      { id: 'chair_stand', name: '椅子起坐（坐下起立）', icon: '🪑', target: '建議 8～10 次 (做1~2組)', score: 30, videoUrl: 'https://www.youtube.com/results?search_query=銀髮族+椅子起坐+深蹲教學' },
      { id: 'tiptoe_chair', name: '手扶椅墊腳尖', icon: '🦶', target: '建議 10～15 次', score: 20, videoUrl: 'https://www.youtube.com/results?search_query=長者+扶椅墊腳尖+防跌' },
      { id: 'chair_stretch', name: '坐姿肩頸伸展操', icon: '🧘‍♀️', target: '建議 5～10 分鐘', score: 20, videoUrl: 'https://www.youtube.com/results?search_query=銀髮族+坐姿伸展操+椅子操' },
      { id: 'deep_breath', name: '慢速深呼吸與拍手', icon: '👏', target: '建議 5 分鐘', score: 10, videoUrl: null }
    ];

    const AUDIO_FILES = {
      greeting: '01.m4a',
      singleDone: '02.m4a',
      needMore: '03.m4a',
      goalMet: '04.m4a',
      goalExceeded: '05.m4a'
    };

    let currentAudioTrack = AUDIO_FILES.greeting;

    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function getStorageData() {
      try { return JSON.parse(localStorage.getItem('popo_exercise_data')) || {}; } catch(e) { return {}; }
    }

    function saveStorageData(data) {
      localStorage.setItem('popo_exercise_data', JSON.stringify(data));
    }

    function playAudio(src) {
      currentAudioTrack = src;
      const audio = document.getElementById('audio-player');
      audio.src = src;
      audio.play().catch(e => console.log("Audio play:", e));
    }

    function playCurrentAudio() { playAudio(currentAudioTrack); }

    function evaluateProgress() {
      const today = getTodayKey();
      const allData = getStorageData();
      const todayDone = allData[today] || [];

      let totalScore = 0;
      todayDone.forEach(id => {
        const ex = EXERCISES.find(e => e.id === id);
        if (ex) totalScore += ex.score;
      });

      const count = todayDone.length;
      const fillBar = document.getElementById('progress-bar-fill');
      const starDisplay = document.getElementById('star-display');
      const progressText = document.getElementById('progress-text');
      const heroAvatar = document.getElementById('hero-avatar');
      const speechBubble = document.getElementById('speech-bubble-text');

      let pct = Math.min(100, Math.round((totalScore / 60) * 100));
      fillBar.style.width = pct + '%';

      if (count === 0) {
        starDisplay.textContent = '☆☆☆';
        progressText.textContent = '尚未開始，今天選 2~3 項動一動！';
        heroAvatar.src = 'akai_wave.png?v=200';
        speechBubble.textContent = '婆婆早安！今天想做什麼運動呢？我來陪你一起動一動喔！';
        currentAudioTrack = AUDIO_FILES.greeting;
      } else if (totalScore < 60) {
        starDisplay.textContent = '★☆☆';
        progressText.textContent = `已完成 ${count} 項 (活力值 ${totalScore} 分，差一點就滿分囉)`;
        heroAvatar.src = 'akai_wave.png?v=200';
        speechBubble.textContent = '婆婆動得很好喔！再加一項就達標滿分囉，阿凱幫您加油！';
        currentAudioTrack = AUDIO_FILES.needMore;
      } else if (totalScore >= 60 && totalScore < 90) {
        starDisplay.textContent = '★★☆';
        progressText.textContent = `已完成 ${count} 項 (活力值 ${totalScore} 分，運動量充足！棒棒！)`;
        heroAvatar.src = 'akai_thumbs.png';
        speechBubble.textContent = '哇！今天的運動量剛剛好，婆婆真厲害，超讚的！👍👍';
        currentAudioTrack = AUDIO_FILES.goalMet;
      } else {
        starDisplay.textContent = '★★★';
        progressText.textContent = `太厲害了！已完成 ${count} 項 (活力值 ${totalScore} 分，超充實！)`;
        heroAvatar.src = 'akai_heart.png';
        speechBubble.textContent = '婆婆今天活力滿滿！記得喝杯溫開水、好好休息喔，愛您！❤️';
        currentAudioTrack = AUDIO_FILES.goalExceeded;
      }
    }

    function renderExerciseList() {
      const container = document.getElementById('exercise-list-container');
      const today = getTodayKey();
      const allData = getStorageData();
      const todayDone = allData[today] || [];

      container.innerHTML = '';

      EXERCISES.forEach(ex => {
        const isDone = todayDone.includes(ex.id);
        const card = document.createElement('div');
        card.className = `ex-card ${isDone ? 'checked' : ''}`;

        const videoBtnHtml = ex.videoUrl 
          ? `<a href="${ex.videoUrl}" target="_blank" class="video-link-btn" onclick="event.stopPropagation()">🎬 影片示範教學</a>`
          : '';

        card.innerHTML = `
          <div class="ex-top">
            <div class="ex-name-box">
              <span class="ex-icon">${ex.icon}</span>
              <span class="ex-name">${ex.name}</span>
            </div>
            <span class="ex-badge">${isDone ? '✅ 已打卡' : '＋' + ex.score + '分'}</span>
          </div>
          <div class="ex-info-row">
            <span class="ex-target">${ex.target}</span>
            ${videoBtnHtml}
          </div>
          <button class="check-btn ${isDone ? 'btn-done' : 'btn-todo'}" onclick="toggleExercise('${ex.id}')">
            ${isDone ? '✓ 完成打卡 (點此取消)' : '點我打卡'}
          </button>
        `;
        container.appendChild(card);
      });
    }

    function toggleExercise(id) {
      const today = getTodayKey();
      let allData = getStorageData();
      let todayDone = allData[today] || [];

      const idx = todayDone.indexOf(id);
      let isNewlyCompleted = false;

      if (idx > -1) {
        todayDone.splice(idx, 1);
      } else {
        todayDone.push(id);
        isNewlyCompleted = true;
      }

      allData[today] = todayDone;
      saveStorageData(allData);

      renderExerciseList();
      evaluateProgress();

      if (isNewlyCompleted) {
        let totalScore = 0;
        todayDone.forEach(exId => {
          const e = EXERCISES.find(item => item.id === exId);
          if (e) totalScore += e.score;
        });

        if (totalScore >= 90) {
          showModal('akai_heart.png', '婆婆活力滿滿！❤️', '超棒的！今天完成大成功，記得喝杯溫水休息喔！');
          playAudio(AUDIO_FILES.goalExceeded);
        } else if (totalScore >= 60) {
          showModal('akai_thumbs.png', '今日運動達標！👍👍', '阿凱給婆婆比兩個大拇指！超讚的！');
          playAudio(AUDIO_FILES.goalMet);
        } else {
          showModal('akai_wave.png?v=200', '太厲害了！🎉', '又完成一項囉！阿凱幫您加油！');
          playAudio(AUDIO_FILES.singleDone);
        }
      }
    }

    function showModal(imgSrc, title, body) {
      document.getElementById('modal-img').src = imgSrc;
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').textContent = body;
      document.getElementById('reward-modal').classList.add('show');
    }

    function closeModal() { document.getElementById('reward-modal').classList.remove('show'); }

    window.addEventListener('DOMContentLoaded', () => {
      const d = new Date();
      const weekNames = ['日','一','二','三','四','五','六'];
      document.getElementById('current-date').textContent = `${d.getMonth()+1}月${d.getDate()}日 (週${weekNames[d.getDay()]})`;
      renderExerciseList();
      evaluateProgress();
    });
  </script>
</body>
</html>
